name: Validate quest 15547 v3

on:
  push:
    branches:
      - validate-15547-v3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Format quest files
        run: npx biome check --write operations/model-evals/src/*.js operations/model-monitor/src/EvalsPage.jsx operations/model-monitor/src/hooks/useModelEvals.js operations/model-monitor/src/App.jsx
      - name: Model eval unit tests
        run: node --test operations/model-evals/src/*.test.js
      - name: Verify formatting
        run: npx biome check operations/model-evals/src/*.js operations/model-monitor/src/EvalsPage.jsx operations/model-monitor/src/hooks/useModelEvals.js operations/model-monitor/src/App.jsx
      - name: Install model monitor dependencies
        run: npm ci --prefix operations/model-monitor
      - name: Build model monitor
        run: npm run build --prefix operations/model-monitor
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git config user.name "muhamedsohaib"
            git config user.email "muhammadsohaibsaif@gmail.com"
            git add operations/model-evals/src operations/model-monitor/src
            git commit -m "style: format quest 15547 [skip ci]"
            git push origin HEAD:validate-15547-v3
          fi
